name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run core unit tests
        id: core_tests
        run: gradle :core:test --console=plain
      - name: Run storage JVM unit tests
        id: storage_tests
        run: gradle :storage:testDebugUnitTest --console=plain
      - name: Verify storage dependencies
        id: storage_dependencies
        run: |
          gradle :storage:dependencies --configuration debugRuntimeClasspath --console=plain
          gradle :storage:dependencies --configuration debugUnitTestRuntimeClasspath --console=plain
          gradle :storage:dependencies --configuration kspDebugKotlinProcessorClasspath --console=plain
          gradle :storage:dependencies --configuration kspReleaseKotlinProcessorClasspath --console=plain
      - name: Run KSP and build storage library (Debug and Release)
        id: storage_build
        run: |
          set -euo pipefail
          gradle :storage:kspDebugKotlin --rerun-tasks --no-build-cache --console=plain --info | tee "$RUNNER_TEMP/storage-ksp-debug.log"
          if grep -Eq '^> Task :storage:kspDebugKotlin (NO-SOURCE|SKIPPED|UP-TO-DATE|FROM-CACHE)$' "$RUNNER_TEMP/storage-ksp-debug.log"; then
            echo 'Debug KSP did not execute.' >&2
            exit 1
          fi
          if ! grep -Fxq '> Task :storage:kspDebugKotlin' "$RUNNER_TEMP/storage-ksp-debug.log"; then
            echo 'Debug KSP task did not execute normally; inspect its Gradle outcome above.' >&2
            exit 1
          fi

          gradle :storage:kspReleaseKotlin --rerun-tasks --no-build-cache --console=plain --info | tee "$RUNNER_TEMP/storage-ksp-release.log"
          if grep -Eq '^> Task :storage:kspReleaseKotlin (NO-SOURCE|SKIPPED|UP-TO-DATE|FROM-CACHE)$' "$RUNNER_TEMP/storage-ksp-release.log"; then
            echo 'Release KSP did not execute.' >&2
            exit 1
          fi
          if ! grep -Fxq '> Task :storage:kspReleaseKotlin' "$RUNNER_TEMP/storage-ksp-release.log"; then
            echo 'Release KSP task did not execute normally; inspect its Gradle outcome above.' >&2
            exit 1
          fi

          if ! find storage/schemas -type f -name '*.json' -print -quit | grep -q .; then
            echo 'Room schema export did not produce a JSON schema under storage/schemas.' >&2
            exit 1
          fi

          gradle :storage:assembleDebug :storage:assembleRelease --console=plain
      - name: Upload Room schema
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: storage/schemas/
          if-no-files-found: warn
      - name: Run storage Android driver instrumentation tests
        id: storage_android_tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :storage:connectedDebugAndroidTest --console=plain
      - name: Build debug APK
        id: apk_build
        if: ${{ always() && !cancelled() && steps.setup_java.outcome == 'success' && steps.setup_gradle.outcome == 'success' }}
        run: gradle :app:assembleDebug --console=plain
      - name: Upload core test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests/test/
            core/build/test-results/test/
          if-no-files-found: warn
      - name: Upload storage test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-test-reports
          path: |
            storage/build/reports/tests/testDebugUnitTest/
            storage/build/test-results/testDebugUnitTest/
            storage/build/reports/androidTests/connected/
            storage/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Upload debug APK
        if: ${{ always() && steps.apk_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish verification summary
        if: ${{ always() }}
        env:
          CORE_TEST_RESULT: ${{ steps.core_tests.outcome }}
          STORAGE_TEST_RESULT: ${{ steps.storage_tests.outcome }}
          STORAGE_ANDROID_TEST_RESULT: ${{ steps.storage_android_tests.outcome }}
          STORAGE_DEPENDENCIES_RESULT: ${{ steps.storage_dependencies.outcome }}
          STORAGE_BUILD_RESULT: ${{ steps.storage_build.outcome }}
          APK_BUILD_RESULT: ${{ steps.apk_build.outcome }}
        run: |
          {
            echo '## Verification results'
            echo '| Step | Result |'
            echo '| --- | --- |'
            echo "| :core:test | ${CORE_TEST_RESULT} |"
            echo "| :storage:testDebugUnitTest | ${STORAGE_TEST_RESULT} |"
            echo "| :storage:connectedDebugAndroidTest | ${STORAGE_ANDROID_TEST_RESULT} |"
            echo "| :storage dependency resolution | ${STORAGE_DEPENDENCIES_RESULT} |"
            echo "| :storage KSP (Debug/Release) + assemble (Debug/Release) | ${STORAGE_BUILD_RESULT} |"
            echo "| :app:assembleDebug | ${APK_BUILD_RESULT} |"
            echo '| JDK | 17 (Temurin) |'
            echo '| Gradle | 9.5.0 (gradle/actions/setup-gradle) |'
          } >> "$GITHUB_STEP_SUMMARY"
